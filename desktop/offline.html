<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Inventario Bell</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #101010;
        color: #e5e7eb;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Ubuntu,
          sans-serif;
      }

      .tarjeta {
        width: 100%;
        max-width: 460px;
        padding: 32px;
        border: 1px solid #2f2f2f;
        border-radius: 18px;
        background: #1b1b1b;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        text-align: center;
      }

      img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        color: #fb923c;
      }

      p {
        margin: 0 0 12px;
        line-height: 1.55;
        color: #b6b6b6;
      }

      button {
        margin-top: 14px;
        padding: 12px 22px;
        border: 0;
        border-radius: 10px;
        background: #f97316;
        color: #111;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #fb923c;
      }

      .nota {
        margin-top: 18px;
        font-size: 13px;
        color: #7d7d7d;
      }
    </style>
  </head>
  <body>
    <main class="tarjeta">
      <img src="build/icon.png" alt="Inventario Bell" />
      <h1>Sin conexión</h1>
      <p>No pudimos cargar Inventario Bell. Revisa tu conexión a internet.</p>
      <p class="nota">
        Si el servidor estaba dormido, la primera carga puede tardar hasta un
        minuto. Espera un momento y vuelve a intentar.
      </p>
      <button id="reintentar">Reintentar</button>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const url =
        params.get("url") ||
        "https://asistente-inventario-bell-beta.vercel.app";

      document.getElementById("reintentar").addEventListener("click", () => {
        window.location.href = url;
      });
    </script>
  </body>
</html>
